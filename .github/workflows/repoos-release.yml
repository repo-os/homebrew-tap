name: Update RepoOS formula

on:
  repository_dispatch:
    types: [repoos-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula from npm
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -o pipefail
          test -n "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          URL="https://registry.npmjs.org/@repo-os/repoos/-/repoos-${VERSION}.tgz"
          SHA256=""
          for attempt in {1..18}; do
            if SHA256="$(curl --fail --silent --show-error "$URL" | shasum -a 256 | awk '{print $1}')" \
              && [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              break
            fi
            SHA256=""
            if [[ "$attempt" -lt 18 ]]; then
              echo "npm tarball for ${VERSION} is not available yet (attempt ${attempt}/18); retrying in 10s..." >&2
              sleep 10
            fi
          done
          test -n "$SHA256" || { echo "npm tarball for ${VERSION} did not become available after 3 minutes" >&2; exit 1; }
          VERSION="$VERSION" URL="$URL" SHA256="$SHA256" ruby <<'RUBY'
          path = "Formula/repoos.rb"
          text = File.read(path)
          version = ENV.fetch("VERSION")
          url = ENV.fetch("URL")
          sha256 = ENV.fetch("SHA256")
          updated = text
            .sub(/url "[^"]+"/, "url \"#{url}\"")
            .sub(/sha256 "[^"]+"/, "sha256 \"#{sha256}\"")
          abort "Formula did not contain the expected url/sha256 fields" if updated == text
          File.write(path, updated)
          puts "Updated RepoOS formula to #{version} (#{sha256})"
          RUBY

      - name: Audit and test formula
        run: |
          # setup-homebrew registers this checkout as repo-os/tap. Recent
          # Homebrew versions reject direct Formula/*.rb paths, so use the
          # qualified formula name to validate the updated checkout.
          brew audit --formula repo-os/tap/repoos
          brew install --build-from-source repo-os/tap/repoos
          brew test repo-os/tap/repoos

      - name: Commit formula update
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/repoos.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
          else
            git commit -m "repoos ${VERSION}"
            git push origin main
          fi
